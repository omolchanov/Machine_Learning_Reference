version: 2

models:
  - name: customer_orders
    description: Customer-level order counts and total spend (full table refresh).
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: order_count
        tests:
          - not_null
      - name: total_spent
        tests:
          - not_null
  - name: fct_orders_scd_context
    description: >
      Order lines with pre-change customer city and catalog price from SCD2 history
      (superseded snapshot row when present) versus current staging.
      Run demo_scd2_run.py; see snapshots/ for canonical dbt snapshot SQL.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
  - name: fct_orders
    description: >
      Order-line fact table. Uses incremental materialization: first run loads all
      history from stg_orders; later runs append only rows with order_date after the
      fact table's current max(order_date). Raw orders also carry updated_at for
      merge-style incrementals when rows can change after insert.
    columns:
      - name: order_id
        description: Primary key for each order line.
        tests:
          - unique
          - not_null
      - name: order_date
        description: Watermark column for append incremental filtering in this model.
      - name: updated_at
        description: Source change timestamp; use for incremental merge when status or amounts change.
  - name: product_revenue
    description: Product-level units sold and revenue (one row per product).
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: order_line_count
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
  - name: daily_sales
    description: Daily order activity and revenue (one row per order_date).
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: order_line_count
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
  - name: demo_macro_rounded_line_totals
    description: >
      Per order line; total uses round_money from local package round_money_pkg
      (see packages.yml).
    columns:
      - name: id
        description: Customer id for the order line.
      - name: product_id
        description: Product on this order line.
      - name: total
        description: round_money_pkg.round_money(quantity * unit_price).