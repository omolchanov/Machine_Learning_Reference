version: 2

sources:
  - name: raw
    description: Tables loaded by dbt_sample/migrations (outside dbt).
    database: dbt_sample
    schema: dbt_sample
    tables:
      - name: customers
        description: Customer records (customer_id, name, email, city).
      - name: products
        description: Product catalog (product_id, name, category, unit_price).
      - name: orders
        description: Order line items linked to customers and products.