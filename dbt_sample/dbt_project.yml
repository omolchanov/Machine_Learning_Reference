name: dbt_sample
version: 1.0.0
config-version: 2
profile: dbt_sample

model-paths:
  - models

snapshot-paths:
  - snapshots

clean-targets:
  - target
  - dbt_packages

models:
  dbt_sample:
    staging:
      +materialized: view
    scd:
      +materialized: view
    features:
      +materialized: view
      +tags:
        - feature_store
    marts:
      +materialized: table
      fct_orders:
        +materialized: incremental